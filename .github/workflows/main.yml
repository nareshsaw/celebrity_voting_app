name: Fullstack CI/CD via Docker Compose (Remote Build)

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy project files to remote server
        run: |
          rsync -avz --delete ./ ubuntu@51.21.194.131:~/celebrity

      - name: Build and deploy on remote server
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@51.21.194.131 << 'EOF'
            cd ~/celebrity
            docker-compose down --remove-orphans
            docker-compose build
            docker-compose up -d
          EOF
