name: Fullstack CI/CD via Docker Compose (Remote Build)

on:
  push:
    branches:
      - development

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Trust SSH host and copy files to remote server
        run: |
          mkdir -p ~/.ssh
          echo "[51.21.194.131]:22 $(ssh-keyscan -p 22 -H 51.21.194.131 2>/dev/null)" >> ~/.ssh/known_hosts
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" ./ ubuntu@51.21.194.131:~/celebrity

      - name: Build and deploy via Docker Compose on remote
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@51.21.194.131 << 'EOF'
            cd ~/celebrity
            docker-compose down --remove-orphans
            docker-compose build
            docker-compose up -d
          EOF
